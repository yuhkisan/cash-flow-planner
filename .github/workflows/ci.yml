name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
          POSTGRES_DB: cashflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: cashflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration --workspace=backend
      - run: npm run build
