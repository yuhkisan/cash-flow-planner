name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
          POSTGRES_DB: cashflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: cashflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Commit generated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add package lock [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration --workspace=backend
      - run: npm run build
